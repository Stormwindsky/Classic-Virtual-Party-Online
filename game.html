<!DOCTYPE html>
<!--
  Classic Virtual Party Online
  Code:   MIT-0 and 0BSD (BSD-0)
  Assets: CC0 1.0 Universal (see the assets/ folder)
  Ported from a Scratch (.sb3) project. Online multiplayer uses PeerJS.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Classic Virtual Party Online</title>

<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  /* The stage keeps a 4:3 ratio (Scratch stage is 480x360) */
  #stage {
    position: fixed;
    inset: 0;
    margin: auto;
    aspect-ratio: 4 / 3;
    width: min(100vw, 133.333vh);
    background: #000;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    user-select: none;
  }

  /* Small overlay boxes (variable monitor, status, buttons) */
  .overlay {
    position: absolute;
    background: rgba(255, 255, 255, 0.92);
    color: #333;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: clamp(10px, 1.8vw, 14px);
  }

  #skin-monitor { left: 6px; top: 6px; display: flex; align-items: center; gap: 6px; }
  #skin-monitor input { width: 80px; }
  #skin-value { background: #ff8c1a; color: #fff; border-radius: 3px; padding: 0 6px; }

  #credits-button {
    right: 6px; top: 6px;
    background: #4c97ff; color: #fff;
    font-weight: 600; text-decoration: none;
  }
  #credits-button:hover { background: #3373cc; }

  #status { left: 6px; bottom: 6px; }
  #hint { left: 50%; bottom: 6px; transform: translateX(-50%); pointer-events: none; }
</style>
</head>

<body>
<div id="stage">
  <canvas id="canvas" width="960" height="720"></canvas>

  <!-- Visible "Skin" variable, limited from 1 to 2 -->
  <div class="overlay" id="skin-monitor">
    Skin
    <input id="skin-slider" type="range" min="1" max="2" step="1" value="2">
    <b id="skin-value">2</b>
  </div>

  <a class="overlay" id="credits-button" target="_blank" rel="noopener"
     href="https://github.com/Stormwindsky/Classic-Virtual-Party-Online/blob/main/CREDITS.md">Credits</a>

  <div class="overlay" id="status">Connecting...</div>
  <div class="overlay" id="hint">Click or touch to move and start the music</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";

/* ==========================================================================
   1. CONFIGURATION
   ========================================================================== */

const SCALE = 2;            // canvas pixels per Scratch stage unit (960x720 canvas)
const TICKS_PER_SECOND = 30; // Scratch runs scripts at 30 fps
const ROOM_ID = "classic-virtual-party-online-room-v1";

// Image files, relative to this HTML file
const IMAGE_FILES = {
  floor:        "assets/images/floor.png",
  danceFloor:   "assets/images/dance_floor.png",
  dj:           "assets/images/dj.png",
  znak:         "assets/images/znak.svg",
  hitbox:       "assets/images/hitbox.png",
  speaker:      "assets/images/speaker.png",
  playerMale:   "assets/images/player_male.svg",
  playerFemale: "assets/images/player_female.svg",
};
const MUSIC_FILE = "assets/sounds/music.wav";

// Costume data copied from project.json:
// bitmapResolution + rotation center (in image pixels)
const COSTUMES = {
  floor:        { resolution: 2, centerX: 480,                centerY: 360 },
  danceFloor:   { resolution: 2, centerX: 256,                centerY: 160 },
  dj:           { resolution: 2, centerX: 176,                centerY: 2 },
  znak:         { resolution: 1, centerX: 76.1716167138373,   centerY: 70.12293858943222 },
  hitbox:       { resolution: 2, centerX: 480,                centerY: 360 },
  speaker:      { resolution: 2, centerX: 466,                centerY: 150 },
  playerMale:   { resolution: 1, centerX: 38.03909016296774,  centerY: 39.53387000186939 },
  playerFemale: { resolution: 1, centerX: 45.470160270414766, centerY: 40.79204818738515 },
};

// Player costumes by "Skin" variable value (1 = Male, 2 = Female)
const SKIN_COSTUME = { 1: "playerMale", 2: "playerFemale" };
const PLAYER_SIZE = 50;     // sprite size in percent
const HITBOX_Y = 63;        // hitbox sprite position
const HITBOX_IMAGE_HEIGHT = 394;

/* ==========================================================================
   2. STATE
   ========================================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const images = {};

// The local player (starts at x=2, y=-147, pointing up, like the Scratch project)
const player = { x: 2, y: -147, direction: 0, skin: 2 };

// Mouse / touch position in stage coordinates
const pointer = { x: 0, y: 0, down: false };

// Other players: id -> { x, y, direction, skin, targetX, targetY, targetDirection, lastSeen }
const remotePlayers = new Map();

/* ==========================================================================
   3. DRAWING HELPERS
   ========================================================================== */

// Draw a sprite using Scratch coordinates (center origin, y up)
function drawSprite(costumeName, source, x, y, sizePercent, direction, alpha) {
  const costume = COSTUMES[costumeName];
  const scale = (sizePercent / 100) * SCALE / costume.resolution;

  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.translate(canvas.width / 2 + x * SCALE, canvas.height / 2 - y * SCALE);
  ctx.rotate(((direction - 90) * Math.PI) / 180); // Scratch: 90 = not rotated
  ctx.scale(scale, scale);
  ctx.drawImage(source || images[costumeName], -costume.centerX, -costume.centerY);
  ctx.restore();
}

function playerCostumeName(skin) {
  return SKIN_COSTUME[skin] || SKIN_COSTUME[2];
}

/* ==========================================================================
   4. DANCE FLOOR COLOR EFFECT
   The Scratch script adds 25 to the "color" effect every 0.2 s.
   Scratch's color effect 200 = full hue circle, so +25 = 45 degrees.
   We pre-compute 8 hue-rotated copies of the image (8 * 45 = 360).
   ========================================================================== */

const danceFloorFrames = [];

function createHueRotatedCanvas(image, degrees) {
  const c = document.createElement("canvas");
  c.width = image.naturalWidth;
  c.height = image.naturalHeight;
  const g = c.getContext("2d");
  g.drawImage(image, 0, 0);
  if (degrees === 0) return c;

  const angle = (degrees * Math.PI) / 180;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const k = Math.sqrt(1 / 3);

  // Standard hue rotation matrix (rotation around the gray axis)
  const m = [
    cos + (1 - cos) / 3,     (1 - cos) / 3 - k * sin, (1 - cos) / 3 + k * sin,
    (1 - cos) / 3 + k * sin, cos + (1 - cos) / 3,     (1 - cos) / 3 - k * sin,
    (1 - cos) / 3 - k * sin, (1 - cos) / 3 + k * sin, cos + (1 - cos) / 3,
  ];
  const clamp = v => Math.max(0, Math.min(255, v));

  try {
    const data = g.getImageData(0, 0, c.width, c.height);
    const px = data.data;
    for (let i = 0; i < px.length; i += 4) {
      const r = px[i], gr = px[i + 1], b = px[i + 2];
      px[i]     = clamp(r * m[0] + gr * m[1] + b * m[2]);
      px[i + 1] = clamp(r * m[3] + gr * m[4] + b * m[5]);
      px[i + 2] = clamp(r * m[6] + gr * m[7] + b * m[8]);
    }
    g.putImageData(data, 0, 0);
  } catch (e) {
    // Opened from file:// (canvas is "tainted"): fall back to the CSS filter
    g.clearRect(0, 0, c.width, c.height);
    g.filter = "hue-rotate(" + degrees + "deg)";
    g.drawImage(image, 0, 0);
  }
  return c;
}

/* ==========================================================================
   5. INPUT
   ========================================================================== */

const skinSlider = document.getElementById("skin-slider");
const skinValue = document.getElementById("skin-value");

skinSlider.addEventListener("input", () => {
  player.skin = Number(skinSlider.value);
  skinValue.textContent = player.skin;
});

function updatePointer(event) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 480 - 240;
  pointer.y = 180 - ((event.clientY - rect.top) / rect.height) * 360;
}

canvas.addEventListener("pointerdown", event => {
  pointer.down = true;
  updatePointer(event);
  startMusic();
});
window.addEventListener("pointermove", updatePointer);
window.addEventListener("pointerup", () => { pointer.down = false; });
window.addEventListener("pointercancel", () => { pointer.down = false; });
canvas.addEventListener("contextmenu", event => event.preventDefault());

/* ==========================================================================
   6. MUSIC
   Scratch: set volume to 50, then forever "play sound until done".
   Browsers only allow audio after a user gesture, so it starts on first click.
   ========================================================================== */

let music = null;

function startMusic() {
  if (!music) {
    music = new Audio(MUSIC_FILE);
    music.loop = true;
    music.volume = 0.5;
  }
  music.play()
    .then(() => { document.getElementById("hint").style.display = "none"; })
    .catch(() => {});
}

/* ==========================================================================
   7. GAME LOGIC (runs 30 times per second)
   ========================================================================== */

// Bounding box of the player sprite, in stage coordinates (rotation included)
function getPlayerBounds() {
  const name = playerCostumeName(player.skin);
  const costume = COSTUMES[name];
  const image = images[name];
  const scale = (PLAYER_SIZE / 100) / costume.resolution;
  const angle = ((player.direction - 90) * Math.PI) / 180;
  const cos = Math.cos(angle), sin = Math.sin(angle);

  const corners = [
    [0, 0], [image.naturalWidth, 0],
    [0, image.naturalHeight], [image.naturalWidth, image.naturalHeight],
  ];
  let minY = Infinity, maxY = -Infinity;
  for (const [px, py] of corners) {
    const lx = (px - costume.centerX) * scale;
    const ly = (py - costume.centerY) * scale;
    const y = player.y - (lx * sin + ly * cos);
    minY = Math.min(minY, y);
    maxY = Math.max(maxY, y);
  }
  return { minY, maxY };
}

// Vertical extent of the hitbox sprite
const hitboxCenter = COSTUMES.hitbox.centerY / COSTUMES.hitbox.resolution;
const HITBOX_TOP = HITBOX_Y + hitboxCenter;
const HITBOX_BOTTOM = HITBOX_TOP - HITBOX_IMAGE_HEIGHT / COSTUMES.hitbox.resolution;

function gameTick() {
  // Script 1: while the mouse is down, point towards it and move 3 steps
  if (pointer.down) {
    player.direction = (Math.atan2(pointer.x - player.x, pointer.y - player.y) * 180) / Math.PI;
    const radians = (player.direction * Math.PI) / 180;
    player.x += 3 * Math.sin(radians);
    player.y += 3 * Math.cos(radians);
    player.x = Math.max(-240, Math.min(240, player.x));
    player.y = Math.max(-180, Math.min(180, player.y));
  }

  // Script 2: when touching the hitbox, change y by -10
  const bounds = getPlayerBounds();
  if (bounds.maxY > HITBOX_BOTTOM && bounds.minY < HITBOX_TOP) {
    player.y -= 10;
  }
}

setInterval(gameTick, 1000 / TICKS_PER_SECOND);

/* ==========================================================================
   8. RENDERING (layer order is the same as the Scratch project)
   ========================================================================== */

function render(time) {
  const frame = Math.floor(time / 200) % 8; // dance floor color step

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawSprite("floor", null, 0, 0, 100);
  drawSprite("danceFloor", danceFloorFrames[frame], 0, -50, 100);
  drawSprite("znak", null, -6, 130, 40);
  drawSprite("dj", null, 2, 125, 70);
  drawSprite("hitbox", null, 0, HITBOX_Y, 100, 90, 0.01); // ghost effect 99
  drawSprite("speaker", null, 0, 108, 50);

  // Other players (smoothed), then the local player on top
  for (const other of remotePlayers.values()) {
    other.x += (other.targetX - other.x) * 0.35;
    other.y += (other.targetY - other.y) * 0.35;
    other.direction = other.targetDirection;
    drawSprite(playerCostumeName(other.skin), null, other.x, other.y, PLAYER_SIZE, other.direction);
  }
  drawSprite(playerCostumeName(player.skin), null, player.x, player.y, PLAYER_SIZE, player.direction);

  requestAnimationFrame(render);
}

/* ==========================================================================
   9. ONLINE MULTIPLAYER (PeerJS)
   The first player to connect registers ROOM_ID and becomes the host.
   Everyone else connects to the host, which relays positions to all players.
   If the host leaves, clients reconnect and one of them becomes the new host.
   ========================================================================== */

const statusElement = document.getElementById("status");
let peer = null;
let hostConnection = null;      // client only: connection to the host
let isHost = false;
const clientConnections = new Map(); // host only: peer id -> connection
let reconnecting = false;

function updateStatus() {
  statusElement.textContent = "Online - players: " + (remotePlayers.size + 1);
}

// Messages: { type: "state", id, x, y, direction, skin }  and  { type: "leave", id }
function handleMessage(message) {
  if (!message) return;

  if (message.type === "state") {
    let other = remotePlayers.get(message.id);
    if (!other) {
      other = { x: message.x, y: message.y, direction: message.direction, skin: message.skin };
      remotePlayers.set(message.id, other);
      updateStatus();
    }
    other.targetX = message.x;
    other.targetY = message.y;
    other.targetDirection = message.direction;
    other.skin = message.skin;
    other.lastSeen = performance.now();
  } else if (message.type === "leave") {
    if (remotePlayers.delete(message.id)) updateStatus();
  }
}

function createStateMessage() {
  return { type: "state", id: peer.id, x: player.x, y: player.y, direction: player.direction, skin: player.skin };
}

function startAsHost() {
  isHost = true;
  peer = new Peer(ROOM_ID);

  peer.on("open", updateStatus);

  peer.on("connection", connection => {
    connection.on("open", () => clientConnections.set(connection.peer, connection));

    connection.on("data", message => {
      if (!message || message.type !== "state") return;
      message.id = connection.peer;            // never trust the sender's id
      handleMessage(message);
      for (const [id, other] of clientConnections) {
        if (id !== connection.peer && other.open) other.send(message);
      }
    });

    const onLeave = () => {
      if (!clientConnections.delete(connection.peer)) return;
      const leave = { type: "leave", id: connection.peer };
      handleMessage(leave);
      for (const other of clientConnections.values()) if (other.open) other.send(leave);
    };
    connection.on("close", onLeave);
    connection.on("error", onLeave);
  });

  peer.on("error", error => {
    if (error.type === "unavailable-id") {   // a host already exists: join it
      peer.destroy();
      startAsClient();
    } else {
      reconnect();
    }
  });
}

function startAsClient() {
  isHost = false;
  peer = new Peer();

  peer.on("open", () => {
    hostConnection = peer.connect(ROOM_ID, { reliable: false });
    hostConnection.on("open", updateStatus);
    hostConnection.on("data", handleMessage);
    hostConnection.on("close", reconnect);
    hostConnection.on("error", reconnect);
  });
  peer.on("error", reconnect);
}

function reconnect() {
  if (reconnecting) return;
  reconnecting = true;
  statusElement.textContent = "Reconnecting...";
  try { if (peer) peer.destroy(); } catch (e) {}
  remotePlayers.clear();
  clientConnections.clear();
  hostConnection = null;
  setTimeout(() => { reconnecting = false; connect(); }, 500 + Math.random() * 1500);
}

function connect() {
  if (typeof Peer === "undefined") {
    statusElement.textContent = "Offline (PeerJS could not be loaded)";
    return;
  }
  startAsHost();
}

// Send our state ~15 times per second and drop players that stopped responding
setInterval(() => {
  if (!peer || !peer.id) return;
  const state = createStateMessage();
  if (isHost) {
    for (const connection of clientConnections.values()) if (connection.open) connection.send(state);
  } else if (hostConnection && hostConnection.open) {
    hostConnection.send(state);
  }
  const now = performance.now();
  for (const [id, other] of remotePlayers) {
    if (now - other.lastSeen > 6000) { remotePlayers.delete(id); updateStatus(); }
  }
}, 66);

/* ==========================================================================
   10. STARTUP
   ========================================================================== */

function loadImage(name) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => { images[name] = image; resolve(); };
    image.onerror = () => reject(new Error("Could not load " + IMAGE_FILES[name]));
    image.src = IMAGE_FILES[name];
  });
}

Promise.all(Object.keys(IMAGE_FILES).map(loadImage))
  .then(() => {
    for (let i = 0; i < 8; i++) {
      danceFloorFrames.push(createHueRotatedCanvas(images.danceFloor, i * 45));
    }
    requestAnimationFrame(render);
    connect();
  })
  .catch(error => { statusElement.textContent = error.message; });
</script>
</body>
</html>
